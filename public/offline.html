<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>인터넷 연결이 필요해요</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        background: linear-gradient(135deg, #eff6ff, #faf5ff, #fdf2f8);
        color: #1f2937;
      }
      .card {
        background: #fff;
        border-radius: 24px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        padding: 32px;
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      .emoji { font-size: 56px; }
      h1 { font-size: 22px; margin: 12px 0 8px; }
      p { color: #4b5563; margin: 0 0 24px; line-height: 1.6; }
      button {
        width: 100%;
        border: 0;
        border-radius: 16px;
        padding: 14px;
        font-size: 17px;
        font-weight: 700;
        color: #fff;
        background: #60a5fa;
      }
    </style>
  </head>
  <body>
    <div class="card" role="alert">
      <div class="emoji" aria-hidden="true">📶</div>
      <h1>인터넷 연결이 필요해요</h1>
      <p>와이파이나 데이터가 연결되어 있는지 확인한 뒤 다시 해 보세요.</p>
      <button onclick="location.reload()">다시 해 보기</button>
    </div>
  </body>
</html>
